<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>JSON Response</title>
</head>
<body>

    <div>
        <p></p>
    </div>
    
</body>
<script>
    let getstudents = async () => {
        let response  = await fetch('http://127.0.0.1:8000/api/allstudents/')
        let data = await response.json();
        for (let i=0;i<data.length;i++){
            document.querySelector('p').innerHTML += data[i].name + "<br>";
        }
    };
    getstudents();

    let addStudent = async () => {
        let response = await fetch('http://127.0.0.1:8000/api/createstudent/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                "name": "John Doe",
                "city": "Lagos",
            })
        });
        let data = await response.json();
        console.log(response)
    };

</script>
</html>
